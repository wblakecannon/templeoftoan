version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm install -g pnpm
        - pnpm install
    build:
      commands:
        - env | grep -e GITHUB_TOKEN -e GITHUB_OWNER -e GITHUB_REPO -e
          GITHUB_SUBMISSION_LABEL -e SUBMISSION_ >>
          .env.production
        - pnpm run build
  artifacts:
    baseDirectory: .next
    files:
      - "**/*"
  cache:
    paths:
      - .next/cache/**/*
      - node_modules/**/*
