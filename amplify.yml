version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm install 22
        - nvm use 22
        - npm install -g pnpm@10
        - pnpm install --frozen-lockfile
    build:
      commands:
        - (env | grep -e GITHUB_TOKEN -e GITHUB_OWNER -e GITHUB_REPO -e
          GITHUB_SUBMISSION_LABEL -e SUBMISSION_ >> .env.production) || true
        - pnpm run build
  artifacts:
    baseDirectory: .next
    files:
      - "**/*"
  cache:
    paths:
      - .next/cache/**/*
      - node_modules/**/*
